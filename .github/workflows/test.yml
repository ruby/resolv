name: test

on: [push, pull_request]

jobs:
  ruby-versions:
    uses: ruby/actions/.github/workflows/ruby_versions.yml@master
    with:
      engine: cruby-jruby
      min_version: 2.5

  build:
    needs: ruby-versions
    name: build (${{ matrix.ruby }} / ${{ matrix.os }})
    strategy:
      matrix:
        ruby: ${{ fromJson(needs.ruby-versions.outputs.versions) }}
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        include:
          - ruby: mswin-head
            os: windows-latest
          - ruby: mswin-4.0
            os: windows-latest
        exclude:
          - ruby: 2.5
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run test
      run: bundle exec rake test
      timeout-minutes: 3
      continue-on-error: ${{ startsWith(matrix.ruby, 'jruby') }}
    - name: Build package
      id: build
      shell: bash
      run: |
        if ruby -e 'exit RUBY_VERSION>="3.0."'; then
          bundle exec rake build
          set pkg/*.gem
          echo pkg=$1 >> $GITHUB_OUTPUT
        fi
    - name: Install gem
      run: |
        gem install ${{ steps.build.outputs.pkg }}
        ruby -rresolv -e 'puts $LOADED_FEATURES.grep(/resolv/)'
        ruby -rresolv -e 'puts Resolv::VERSION'
      if: ${{ steps.build.outputs.pkg }}
      continue-on-error: ${{ startsWith(matrix.ruby, 'jruby') }}
